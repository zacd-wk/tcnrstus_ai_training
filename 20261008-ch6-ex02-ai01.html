    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.min.js"></script>

    <script>
        $(function () {
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travelfood",
                dataType: "json",
                success: showdata,
                error: function () {
                    console.log('error !!');
                    alert('GET /travelfood API Error !!');
                }
            });
        });

        // 建立一個全域或外層變數，用來記錄目前播到第幾筆
        let currentIndex = 0;

        function showdata(data) {
            console.log(data);

            // 定義一個內部函式，專門用來刷新畫面
            function render() {
                // 1. 每次切換前先清空舊畫面
                $('#travelfood-list').empty();

                // 2. 取出目前要顯示的 3 筆資料 (使用 slice 切割陣列)
                const currentData = data.slice(currentIndex, currentIndex + 3);

                // 3. 將這 3 筆資料渲染到網頁上
                currentData.forEach((item) => {
                    const strHTML = `
                    <div class="col-md-6 col-lg-4 mt-3">
                        <div class="box03">
                            <img src="${item.PicURL}" class="img-fluid" alt="">
                            <div class="h4 fw-900 text-center mt-3">${item.Name}(${item['序 號']})</div>
                            <div class="h3">地址: ${item.City}${item.Town}${item.Address}</div>
                            <div class="h3">電話: ${item.Tel}</div>
                            <div class="h3">簡介: ${item.HostWords}</div>
                        </div>
                    </div>
                `;
                    $('#travelfood-list').append(strHTML);
                });

                // 4. 計算下一組的起始索引（每次加 3）
                currentIndex += 3;

                // 5. 無限循環：如果索引超過或等於總資料筆數，就歸零重新開始
                if (currentIndex >= data.length) {
                    currentIndex = 0;
                }
            }

            // 網頁載入後，AJAX 成功當下立即顯示第一組（第 1~3 筆）
            render();

            // 之後每隔 3000 毫秒（3秒）自動呼叫一次，換下 3 筆
            setInterval(render, 3000);
        }
    </script>
